[project]
name = "handmade-backends"
version = "0.1.0"
description = "B2B, Goods and Publications services for Handmade Marketplace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "sqlalchemy[asyncio]>=2.0.35,<3",
  "asyncpg>=0.30,<1", "alembic>=1.13,<2", "httpx>=0.27,<1",
  "boto3>=1.35,<2", "bleach>=6.1,<7", "pillow>=11,<13",
  "python-multipart>=0.0.18,<1", "PyJWT[crypto]>=2.9,<3", "aiokafka>=0.12,<0.14"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8", "ruff>=0.9,<1", "aiosqlite>=0.20,<1", "moto[s3]>=5,<6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["marketplace"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires TEST_POSTGRES_URL and applies Alembic migrations", "kafka: requires a real Kafka broker and PostgreSQL"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]
[tool.coverage.run]
core = "ctrace"
concurrency = ["greenlet", "thread"]
source = ["marketplace"]
branch = true
[tool.coverage.report]
show_missing = true
